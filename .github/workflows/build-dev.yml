name: Build packages (dev)

# On every push to `dev`, builds the unified package on the GitHub runner and
# commits the tarball back into the repo on `dev` under `artifacts/`.

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: build-dev
  cancel-in-progress: true

jobs:
  build:
    name: Build & commit tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Pack into artifacts/
        run: |
          rm -rf artifacts && mkdir -p artifacts
          cd packages/grapheway
          npm pack --pack-destination ../../artifacts >/dev/null
          ls -la ../../artifacts

      - name: Commit artifact back to dev
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[skip ci] build(dev): refresh package tarball"
          file_pattern: artifacts/
