name: Publish to npm

# Publishes the unified grapheway package to npm.
# Bump the version in packages/grapheway/package.json, push to main, and it ships.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  quality:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: bun test

  publish:
    name: Publish to npm
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Authenticate with npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/grapheway
          version="$(node -p "require('./package.json').version")"
          if npm view "grapheway@$version" version >/dev/null 2>&1; then
            echo "✓ grapheway@$version already published — skipped"
          else
            echo "⬆ Publishing grapheway@$version"
            npm publish --access public
          fi

      - name: Verify
        run: |
          cd packages/grapheway
          version="$(node -p "require('./package.json').version")"
          published=$(npm view "grapheway@$version" version 2>/dev/null || echo "not published")
          echo "  grapheway@$published"
