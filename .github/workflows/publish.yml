name: Publish to npm

# Publishes the unified grapheway package to npm.
# Triggers on push/merge to main, or PR to main (quality check only).
# The dev branch stays within GitHub (artifacts only) and never publishes to npm.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  quality:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: bun test

  publish:
    name: Publish to npm
    needs: quality
    runs-on: ubuntu-latest
    # NEVER publish on pull requests or from dev branch.
    # Only publish on push/merge to main (or manual workflow_dispatch on main).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Authenticate with npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/grapheway
          version="$(node -p "require('./package.json').version")"
          if npm view "grapheway@$version" version >/dev/null 2>&1; then
            echo "✓ grapheway@$version already published — skipped"
          else
            echo "⬆ Publishing grapheway@$version"
            npm publish --access public
          fi

      - name: Verify
        run: |
          cd packages/grapheway
          version="$(node -p "require('./package.json').version")"
          echo "Verifying grapheway@$version on npm..."
          for i in {1..10}; do
            published=$(npm view "grapheway@$version" version 2>/dev/null || echo "")
            if [ "$published" = "$version" ]; then
              echo "✓ grapheway@$published verified on npm registry"
              exit 0
            fi
            echo "Waiting for npm registry to index grapheway@$version ($i/10)..."
            sleep 3
          done
          echo "⚠ grapheway@$version published, but registry index is still updating"
