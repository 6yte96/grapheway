name: Refresh adopter index

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check self-submitted agent cards
        run: node scripts/check-adopters.mjs

      - name: Open or update the adopter index PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/adopter-index
          base: main
          title: "chore: refresh adopter index"
          body: |
            Automated refresh of `website/public/adopters.json`.

            This workflow only checks the public `/.well-known/agent` cards of
            sites that submitted themselves. It does not collect visitor data.

            Review the diff and merge through the normal pull request flow.
          commit-message: "chore: refresh adopter index [skip ci]"
          labels: automation
          add-paths: website/public/adopters.json
